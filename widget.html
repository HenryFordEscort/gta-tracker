<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GTA Widget">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GTA Widget</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#02020a;
  --glass:rgba(10,5,28,.7);
  --border:rgba(120,60,255,.18);
  --gold:#ffd700;
  --sub:rgba(180,160,220,.5);
  --danger:#ef4444;
  --warn:#f59e0b;
}
html,body{
  height:100%;
  background:var(--bg);
  font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  color:#fff;
  overflow:hidden;
}
body{
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,12px) env(safe-area-inset-right,12px) env(safe-area-inset-bottom,12px) env(safe-area-inset-left,12px);
  gap:6px;
}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 2px 2px;
}
.logo{font-size:11px;font-weight:800;letter-spacing:2px;color:rgba(180,140,255,.7);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#555;transition:background .4s;}
.sync-dot.ok{background:#22c55e;}
.sync-dot.err{background:#ef4444;}

.row{
  display:flex;align-items:center;gap:8px;
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:12px;
  padding:7px 10px;
  flex-shrink:0;
}
.row.urgent{border-color:rgba(239,68,68,.5);box-shadow:0 0 12px rgba(239,68,68,.15);}
.row.warn{border-color:rgba(245,158,11,.4);box-shadow:0 0 8px rgba(245,158,11,.1);}

.biz-name{
  font-size:9px;font-weight:700;letter-spacing:1.5px;
  color:var(--sub);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.timer{
  font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:.5px;min-width:52px;text-align:right;
}
.timer.idle{color:rgba(120,100,180,.4);font-size:11px;}
.timer.urgent{color:var(--danger);}
.timer.warn{color:var(--warn);}
.timer.ok{color:#fff;}
.timer.full{color:var(--gold);}

.pct{
  font-size:9px;font-weight:700;min-width:26px;text-align:right;
  color:var(--sub);
}

.bar-wrap{position:absolute;bottom:0;left:0;right:0;height:2px;border-radius:0 0 12px 12px;background:rgba(255,255,255,.06);}
.bar-fill{height:100%;border-radius:0 0 12px 12px;transition:width .5s;}

.row{position:relative;}

.nc-row{
  background:rgba(60,10,120,.25);
  border-color:rgba(140,80,255,.25);
}
.nc-label{font-size:8px;font-weight:700;letter-spacing:1px;color:rgba(180,120,255,.6);}

.footer{
  margin-top:auto;
  font-size:8px;letter-spacing:1px;color:rgba(120,100,180,.3);
  text-align:center;
  padding-top:2px;
}
</style>
</head>
<body>
<div class="header">
  <div class="logo">GTA · BUSINESSES</div>
  <div class="sync-dot" id="dot"></div>
</div>
<div id="rows"></div>
<div class="footer" id="updated">connecting…</div>

<script>
const TOPIC='gta-tracker/HenryFordEscort/v1/state';
const NAMES={bunker:'BUNKER',acid:'ACID LAB',meth:'METH LAB',cocaine:'COCAINE',cash:'CASH FACTORY',weed:'WEED FARM'};
const COLORS={bunker:'#e03020',acid:'#76FF03',meth:'#00e5ff',cocaine:'#c084fc',cash:'#ffd700',weed:'#4ade80'};
const ORDER=['bunker','acid','meth','cocaine','cash','weed'];

let S=null;

function fmt(sec){
  if(sec===null||sec===undefined)return'—';
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h>0)return h+'h '+String(m).padStart(2,'0')+'m';
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function elMin(ts){return ts?(Date.now()-ts)/60000:0;}

function supplyRem(id){
  const b=S[id];if(!b||!b.active||!b.supplyExhaustsAt)return null;
  return Math.max(0,(b.supplyExhaustsAt-Date.now())/1000);
}
function supplyPct(id){
  const b=S[id];if(!b||!b.active||!b.supplyExhaustsAt||!b.supplyMin)return null;
  const rem=supplyRem(id);if(rem===null)return null;
  return Math.min(1,rem/(b.supplyMin*60));
}

function timerState(rem){
  if(rem===null)return'idle';
  if(rem<600)return'urgent';
  if(rem<1800)return'warn';
  return'ok';
}

function render(){
  if(!S){document.getElementById('rows').innerHTML='';return;}

  const items=ORDER.map(id=>({id,rem:supplyRem(id),pct:supplyPct(id)}));
  // sort: active urgent first, then by rem asc, idle last
  items.sort((a,b)=>{
    if(a.rem===null&&b.rem===null)return 0;
    if(a.rem===null)return 1;
    if(b.rem===null)return-1;
    return a.rem-b.rem;
  });

  let html='';

  // Nightclub safe
  const safeEl=elMin(S.nc?.safeCollectedAt);
  const safeRem=S.nc?.safeCollectedAt?Math.max(0,(S.nc.safeCollectedAt+S.nc.safeIntervalMin*60000-Date.now())/1000):null;
  const safeState=timerState(safeRem);
  html+=`<div class="row nc-row ${safeState==='urgent'?'urgent':safeState==='warn'?'warn':''}">
    <div style="flex:1"><div class="nc-label">NIGHTCLUB SAFE</div></div>
    <div class="pct"></div>
    <div class="timer ${safeState}">${safeRem!==null?fmt(safeRem):'tracking…'}</div>
    <div class="bar-wrap"><div class="bar-fill" style="width:${safeRem!==null?Math.round((1-safeRem/(S.nc.safeIntervalMin*60))*100):0}%;background:rgba(140,80,255,.6)"></div></div>
  </div>`;

  for(const {id,rem,pct} of items){
    const state=timerState(rem);
    const col=COLORS[id]||'#fff';
    const pctNum=pct!==null?Math.round(pct*100):null;
    html+=`<div class="row ${state==='urgent'?'urgent':state==='warn'?'warn':''}">
      <div class="biz-name" style="color:${col}88">${NAMES[id]}</div>
      <div class="pct">${pctNum!==null?pctNum+'%':''}</div>
      <div class="timer ${rem===null?'idle':pctNum===0?'full':state}" style="${rem!==null&&state==='ok'?'color:'+col:''}">
        ${rem===null?'IDLE':pctNum===0?'FULL':fmt(rem)}
      </div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${pctNum||0}%;background:${col}99"></div></div>
    </div>`;
  }

  document.getElementById('rows').innerHTML=html;
  document.getElementById('updated').textContent='updated '+new Date().toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

// MQTT
const client=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{
  clientId:'gta-widget-'+Math.random().toString(36).slice(2),
  clean:true,reconnectPeriod:3000
});
const dot=document.getElementById('dot');
client.on('connect',()=>{
  dot.className='sync-dot ok';
  client.subscribe(TOPIC,{qos:1});
});
client.on('error',()=>dot.className='sync-dot err');
client.on('offline',()=>dot.className='sync-dot err');
client.on('message',(t,payload)=>{
  try{S=JSON.parse(payload.toString());render();}catch(e){}
});

// fallback: try localStorage
try{const ls=localStorage.getItem('gta_v4');if(ls){S=JSON.parse(ls);render();}}catch(e){}

setInterval(render,1000);
</script>
</body>
</html>
