<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GTA Biz">
<meta name="theme-color" content="#000008">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GTA Business Tracker</title>
<style>
:root{
  --bg:#000008;
  --glass:rgba(8,4,24,.82);
  --border:rgba(110,60,255,.13);
  --border2:rgba(160,100,255,.22);
  --text:#ece8ff;
  --sub:#38386a;
  --sub2:#6060a0;
  --ok:#22c55e;
  --warn:#f59e0b;
  --danger:#ef4444;
  --gold:#ffd700;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
html,body{height:100%;background:var(--bg);}
body{
  min-height:100dvh;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  color:var(--text);font-size:14px;overflow-x:hidden;
}

/* ── AURORA BACKGROUND ─────────────────────────────────── */
#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── LAYOUT ────────────────────────────────────────────── */
.app{position:relative;z-index:1;padding-bottom:130px;}

/* ── HEADER ────────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(0,0,10,.88);
  backdrop-filter:blur(40px) saturate(2);
  border-bottom:1px solid rgba(255,255,255,.04);
}
.hdr-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:max(env(safe-area-inset-top,0px),14px) 18px 10px;
}
.logo{
  display:flex;flex-direction:column;line-height:1;
}
.logo-gta{
  font-size:22px;font-weight:900;letter-spacing:5px;
  background:linear-gradient(90deg,#fff 0%,rgba(200,180,255,.7) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.logo-biz{
  font-size:8px;font-weight:800;letter-spacing:5px;text-transform:uppercase;
  background:linear-gradient(90deg,#ffd700,#ff9000);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-top:1px;
}
.hdr-actions{display:flex;gap:7px;}
.hdr-btn{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  color:var(--sub2);border-radius:12px;padding:9px 14px;
  font-size:13px;cursor:pointer;transition:all .2s;font-weight:700;
}
.hdr-btn:active{background:rgba(255,255,255,.1);color:var(--text);border-color:rgba(255,255,255,.18);}

/* ── MISSION STATS BAR ─────────────────────────────────── */
.mission-bar{
  display:flex;align-items:stretch;
  border-top:1px solid rgba(255,255,255,.04);
  overflow:hidden;
}
.mstat{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 4px;border-right:1px solid rgba(255,255,255,.04);
  cursor:default;
}
.mstat:last-child{border-right:none;}
.mstat-val{font-size:14px;font-weight:900;line-height:1;color:var(--text);}
.mstat-lbl{font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--sub2);margin-top:3px;}

/* ── GLOWING HEADER LINE ───────────────────────────────── */
.hdr-line{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(140,80,255,.6) 30%,rgba(220,120,255,.9) 50%,rgba(140,80,255,.6) 70%,transparent);
  animation:hline 4s ease-in-out infinite;
}
@keyframes hline{0%,100%{opacity:.4;transform:scaleX(.8);}50%{opacity:1;transform:scaleX(1);}}

/* ── NOTIFICATION BANNER ───────────────────────────────── */
#nb,#update-banner{margin:14px 14px 0;padding:13px 16px;border-radius:16px;font-size:12px;display:flex;align-items:center;gap:10px;}
#nb{background:rgba(201,162,39,.07);border:1px solid rgba(201,162,39,.2);color:#c9a227;display:none;}
#update-banner{background:rgba(120,80,255,.08);border:1px solid rgba(160,100,255,.3);color:#c084fc;display:none;}
#nb button,#update-banner button{margin-left:auto;border:none;border-radius:9px;padding:6px 16px;font-size:11px;font-weight:800;cursor:pointer;}
#nb button{background:#c9a227;color:#000;}
#update-banner button{background:#7c3aed;color:#fff;}

/* ── PAUSE BANNER ──────────────────────────────────────── */
#pause-banner{
  margin:14px 14px 0;padding:16px;
  background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);
  border-radius:18px;display:flex;align-items:center;gap:13px;
  animation:pause-pulse 2s ease-in-out infinite;
}
@keyframes pause-pulse{0%,100%{border-color:rgba(239,68,68,.2);}50%{border-color:rgba(239,68,68,.5);box-shadow:0 0 24px rgba(239,68,68,.1);}}
#pause-banner.hidden{display:none;}
.pause-icon{font-size:24px;}
.pause-text{flex:1;}
.pause-title{font-size:13px;font-weight:900;color:#ef4444;letter-spacing:.5px;}
.pause-sub{font-size:10px;color:var(--sub2);margin-top:2px;}
.pause-resume-btn{
  background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border:none;
  border-radius:12px;padding:10px 18px;font-size:12px;font-weight:900;cursor:pointer;
  box-shadow:0 4px 20px rgba(239,68,68,.5);transition:all .15s;
}
.pause-resume-btn:active{transform:scale(.95);}

/* ── SECTION LABEL ─────────────────────────────────────── */
.sec-lbl{
  font-size:8px;font-weight:900;letter-spacing:4px;text-transform:uppercase;
  color:var(--sub2);padding:28px 18px 12px;
  display:flex;align-items:center;gap:12px;
}
.sec-lbl::before,.sec-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06));}
.sec-lbl::before{background:linear-gradient(90deg,rgba(255,255,255,.06),transparent);}

/* ── CARDS ─────────────────────────────────────────────── */
.cards{padding:0 13px;display:flex;flex-direction:column;gap:14px;}

.card{
  border-radius:26px;position:relative;overflow:hidden;
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(30px) saturate(1.4);
  box-shadow:0 24px 80px rgba(0,0,0,.9),0 4px 16px rgba(0,0,0,.6);
  transition:opacity .3s,transform .15s;
  animation:card-in .5s cubic-bezier(.2,0,.2,1) both;
}
.card.off{opacity:.18;filter:saturate(.1) brightness(.5);}

@keyframes card-in{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.cards .card:nth-child(1){animation-delay:.04s;}
.cards .card:nth-child(2){animation-delay:.09s;}
.cards .card:nth-child(3){animation-delay:.14s;}
.cards .card:nth-child(4){animation-delay:.19s;}
.cards .card:nth-child(5){animation-delay:.24s;}
.cards .card:nth-child(6){animation-delay:.29s;}

/* accent glow layer */
.card-glow{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,var(--ag,rgba(120,60,255,.12)) 0%,transparent 65%);
  border-radius:26px;
}
/* top shimmer line */
.card-line{
  height:2px;position:relative;overflow:hidden;
  background:linear-gradient(90deg,transparent,var(--ac,#8040ff) 30%,var(--ac,#8040ff) 70%,transparent);
}
.card-line::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
  animation:shimmer 3s linear infinite;transform:translateX(-100%);
}
@keyframes shimmer{100%{transform:translateX(300%);}}

.card-body{padding:18px 18px 20px;}

/* ── CARD HEADER ───────────────────────────────────────── */
.ch{display:flex;align-items:center;gap:13px;margin-bottom:16px;}
.ch-icon{
  width:48px;height:48px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:23px;
  background:rgba(255,255,255,.04);border:1px solid var(--border2);
  position:relative;transition:all .4s;
}
.ch-icon.on{
  background:rgba(255,255,255,.07);
  box-shadow:0 0 0 1px var(--ac,#8040ff),0 0 22px var(--ag,rgba(120,60,255,.4)),0 0 48px var(--ag,rgba(120,60,255,.15));
}
/* pulsing ring on active */
.ch-icon.on::after{
  content:'';position:absolute;inset:-4px;border-radius:18px;
  border:1px solid var(--ac,#8040ff);opacity:.4;
  animation:ring-pulse 2.5s ease-in-out infinite;
}
@keyframes ring-pulse{0%,100%{opacity:.2;transform:scale(1);}50%{opacity:.6;transform:scale(1.04);}}

.ch-info{flex:1;min-width:0;}
.ch-name{
  font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;line-height:1.1;
  transition:color .3s;
}
.ch-name.on{color:var(--ac,#fff);text-shadow:0 0 24px var(--ag,rgba(120,60,255,.5));}
.ch-sub{font-size:10px;color:var(--sub2);margin-top:4px;line-height:1.4;}
.ch-actions{display:flex;gap:7px;}
.ch-toggle{
  background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--sub);
  border-radius:11px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:12px;transition:all .2s;flex-shrink:0;
}
.ch-toggle.on{
  color:var(--ok);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08);
  box-shadow:0 0 14px rgba(34,197,94,.25);
}
.ch-gear{
  background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--sub2);
  border-radius:11px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;transition:all .2s;flex-shrink:0;
}
.ch-gear:active{background:rgba(255,255,255,.1);color:var(--text);}

/* ── DIVIDER ───────────────────────────────────────────── */
.hdiv{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);margin:15px 0;}

/* ── BOOST PILLS ───────────────────────────────────────── */
.boosts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.boost-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
  border-radius:100px;padding:8px 14px;cursor:pointer;
  font-size:11px;font-weight:700;letter-spacing:.3px;
  transition:all .25s;user-select:none;color:var(--sub2);
}
.boost-pill.on{
  background:rgba(255,179,0,.08);border-color:rgba(255,179,0,.4);color:#ffb300;
  box-shadow:0 0 20px rgba(255,179,0,.2),inset 0 0 16px rgba(255,179,0,.06);
  animation:pill-glow 2.2s ease-in-out infinite;
}
.boost-pill.on-acid{
  background:rgba(118,255,3,.07);border-color:rgba(118,255,3,.35);color:#76ff03;
  box-shadow:0 0 20px rgba(118,255,3,.18);animation:pill-glow-acid 2.2s ease-in-out infinite;
}
@keyframes pill-glow{0%,100%{box-shadow:0 0 12px rgba(255,179,0,.18);}50%{box-shadow:0 0 28px rgba(255,179,0,.45);}}
@keyframes pill-glow-acid{0%,100%{box-shadow:0 0 12px rgba(118,255,3,.15);}50%{box-shadow:0 0 28px rgba(118,255,3,.38);}}
.boost-pill .pill-timer{font-size:10px;opacity:.7;margin-left:2px;}

/* ── TIMER BLOCK ───────────────────────────────────────── */
.timer-wrap{
  position:relative;overflow:hidden;
  background:rgba(0,0,0,.4);border-radius:20px;
  padding:18px 20px 16px;margin-bottom:10px;
  border:1px solid rgba(255,255,255,.04);
}
.timer-wrap::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.02),transparent);
  pointer-events:none;
}
.timer-inner{display:flex;align-items:flex-end;justify-content:space-between;}
.timer-left{flex:1;}
.timer-label{font-size:8px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--sub2);margin-bottom:6px;}
.timer-num{
  font-size:62px;font-weight:900;letter-spacing:-4px;
  font-variant-numeric:tabular-nums;line-height:1;
  transition:color .4s,text-shadow .4s;
}
.timer-num.state-idle{color:var(--sub);font-size:36px;letter-spacing:-1px;font-weight:700;}
.timer-num.state-ok{color:var(--text);}
.timer-num.state-warn{
  color:var(--warn);
  text-shadow:0 0 30px rgba(245,158,11,.5),0 0 60px rgba(245,158,11,.2);
}
.timer-num.state-danger{
  color:var(--danger);
  text-shadow:0 0 24px rgba(239,68,68,.9),0 0 60px rgba(239,68,68,.4);
  animation:danger-pulse 1s ease-in-out infinite;
}
.timer-num.state-done{
  color:var(--ok);font-size:28px;letter-spacing:0;font-weight:800;
  text-shadow:0 0 24px rgba(34,197,94,.6);
}
@keyframes danger-pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.timer-right{text-align:right;padding-left:16px;}
.timer-pct{font-size:30px;font-weight:900;line-height:1;transition:color .4s;}
.timer-dur{font-size:9px;color:var(--sub2);letter-spacing:.5px;margin-top:5px;}
.timer-status{font-size:9px;color:var(--sub2);letter-spacing:.5px;margin-top:5px;}

/* ── PROGRESS BAR ──────────────────────────────────────── */
.prog-wrap{margin:10px 0 6px;}
.prog-track{
  height:8px;border-radius:6px;overflow:hidden;
  background:rgba(255,255,255,.05);position:relative;
}
.prog-fill{
  height:100%;border-radius:6px;position:relative;
  transition:width 1.5s cubic-bezier(.4,0,.2,1);
}
.prog-fill::after{
  content:'';position:absolute;right:0;top:0;bottom:0;
  width:6px;filter:blur(4px);background:inherit;opacity:.9;
}
.prog-fill::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.25) 70%,transparent 100%);
  animation:prog-shimmer 2.5s linear infinite;
}
@keyframes prog-shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(200%);}}

/* ── SEGMENTS (tap zones) ──────────────────────────────── */
.seg-taps{display:flex;gap:5px;margin-top:8px;}
.seg-tap{
  flex:1;height:10px;border-radius:6px;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);
  transition:all .3s;position:relative;overflow:hidden;
}
.seg-tap.on{border-color:transparent;}
.seg-tap.on::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  animation:shimmer 2s linear infinite;
}
.seg-footer{display:flex;justify-content:space-between;padding:4px 1px 14px;}
.seg-lbl{font-size:8px;color:var(--sub);cursor:pointer;padding:2px 0;transition:color .15s;}
.seg-lbl:active{color:var(--text);}

/* ── BUTTONS ───────────────────────────────────────────── */
.btn-row{display:flex;gap:9px;}
.btn-main{
  flex:1;border:none;border-radius:16px;padding:15px 18px;
  font-size:13px;font-weight:900;letter-spacing:.5px;
  cursor:pointer;transition:all .18s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  position:relative;overflow:hidden;
}
.btn-main::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.15),transparent 60%);
  pointer-events:none;
}
.btn-main:active{transform:scale(.95);filter:brightness(.85);}
.btn-main.accent{
  color:#000;font-weight:900;
  box-shadow:0 6px 28px var(--ag,rgba(120,60,255,.4)),0 1px 0 rgba(255,255,255,.4) inset;
}
.btn-main.ghost{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--sub2);}
.btn-sm{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);color:var(--sub2);
  border-radius:12px;padding:10px 15px;font-size:12px;font-weight:700;
  cursor:pointer;white-space:nowrap;transition:all .15s;
}
.btn-sm:active{background:rgba(255,255,255,.1);color:var(--text);}

/* ── NIGHTCLUB SECTIONS ────────────────────────────────── */
.nc-sec-hdr{
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;padding:6px 0;margin-bottom:12px;
}
.nc-sec-title{font-size:9px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--sub2);}
.nc-sec-arrow{font-size:10px;color:var(--sub2);transition:transform .25s;}
.nc-sec-arrow.open{transform:rotate(180deg);}
.nc-sec-body{overflow:hidden;transition:max-height .35s ease;}
.nc-sec-body.closed{max-height:0;}
.nc-sec-body.open{max-height:2000px;}

/* ── SAFE ──────────────────────────────────────────────── */
.safe-amount{
  font-size:44px;font-weight:900;letter-spacing:-2px;color:var(--gold);
  line-height:1;text-shadow:0 0 36px rgba(255,215,0,.4);
}
.safe-ticks{display:flex;gap:6px;margin:13px 0 11px;}
.stk{
  flex:1;height:28px;border-radius:9px;border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:800;color:var(--sub);letter-spacing:.5px;
  transition:all .4s;cursor:pointer;
}
.stk.full{
  background:rgba(255,215,0,.09);border-color:rgba(255,215,0,.4);color:var(--gold);
  box-shadow:0 0 16px rgba(255,215,0,.28),0 0 32px rgba(255,215,0,.08);
}

/* ── DJ ────────────────────────────────────────────────── */
.dj-timer{
  font-size:42px;font-weight:900;letter-spacing:-2px;
  font-variant-numeric:tabular-nums;line-height:1;
}

/* ── WAREHOUSE ─────────────────────────────────────────── */
.wh-product{
  background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);
  border-radius:15px;padding:13px 15px;margin-bottom:9px;transition:all .3s;
}
.wh-product.full-alert{border-color:rgba(255,215,0,.4);background:rgba(255,215,0,.04);box-shadow:0 0 20px rgba(255,215,0,.08);}
.wh-ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.wh-name{font-size:12px;font-weight:800;}
.wh-val{font-size:13px;font-weight:900;}
.wh-biz{font-size:10px;color:var(--sub2);}
.wh-time{font-size:10px;color:var(--sub2);text-align:right;margin-top:2px;}
.wh-pb{background:rgba(255,255,255,.05);border-radius:4px;height:5px;overflow:hidden;}
.wh-pb-fill{height:100%;border-radius:4px;transition:width 2s linear;}
.wh-next{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);border-radius:15px;padding:14px 16px;margin-bottom:11px;}
.wh-next.alert{background:rgba(255,215,0,.06);border-color:rgba(255,215,0,.3);box-shadow:0 0 24px rgba(255,215,0,.08);}
.wh-next-lbl{font-size:8px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--ok);margin-bottom:4px;}
.wh-next.alert .wh-next-lbl{color:var(--gold);}
.wh-next-name{font-size:15px;font-weight:800;margin-bottom:5px;}
.wh-next-time{font-size:32px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--ok);}
.wh-next.alert .wh-next-time{color:var(--gold);}
.wh-input-row{display:flex;align-items:center;gap:9px;margin-top:10px;}
.wh-input{background:rgba(0,0,0,.4);border:1px solid var(--border2);color:var(--text);border-radius:10px;padding:8px 11px;font-size:14px;font-weight:700;width:72px;text-align:center;}

/* ── SAFE/DJ PROGRESS ──────────────────────────────────── */
.prog-bar-wrap{border-radius:6px;overflow:hidden;height:7px;background:rgba(255,255,255,.05);margin-bottom:15px;}
.prog-bar-fill{height:100%;border-radius:6px;transition:width 2s linear;position:relative;}
.prog-bar-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:5px;filter:blur(3px);background:inherit;opacity:.9;}

/* ── MODAL ─────────────────────────────────────────────── */
.modal-ov{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  backdrop-filter:blur(12px);z-index:400;
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-ov.open{opacity:1;pointer-events:all;}
.modal{
  background:linear-gradient(170deg,#0e0820 0%,#060410 100%);
  border:1px solid rgba(255,255,255,.1);border-radius:28px 28px 0 0;
  width:100%;max-height:78dvh;overflow-y:auto;
  padding:22px 20px 50px;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
}
.modal-ov.open .modal{transform:translateY(0);}
.modal-handle{width:38px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:0 auto 22px;}
.modal-title{font-size:18px;font-weight:900;letter-spacing:.3px;margin-bottom:20px;}
.modal-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.modal-row:last-child{border-bottom:none;}
.modal-lbl{font-size:14px;font-weight:700;}
.modal-sub{font-size:10px;color:var(--sub2);margin-top:2px;}

<body>
<canvas id="aurora"></canvas>
<div class="app">

</div>

<script>
// ═══ AURORA BACKGROUND ═══════════════════════════════════════
(function(){
  const c=document.getElementById('aurora');
  const ctx=c.getContext('2d');
  let W,H;
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);

  const blobs=[
    {x:.15,y:.1,r:.55,hue:270,speed:.00008,px:.00012,py:.00007},
    {x:.85,y:.2,r:.5,hue:300,speed:.00006,px:-.00009,py:.0001},
    {x:.1,y:.75,r:.48,hue:220,speed:.00009,px:.00011,py:-.00008},
    {x:.9,y:.85,r:.45,hue:190,speed:.00007,px:-.00008,py:-.00012},
    {x:.5,y:.45,r:.35,hue:255,speed:.0001,px:.00006,py:.00009},
  ];

  let t=0;
  function draw(){
    t++;
    ctx.clearRect(0,0,W,H);

    // base
    ctx.fillStyle='#000008';
    ctx.fillRect(0,0,W,H);

    // blobs
    blobs.forEach(b=>{
      const bx=(b.x+Math.sin(t*b.px)*0.25)*W;
      const by=(b.y+Math.cos(t*b.py)*0.22)*H;
      const br=b.r*Math.min(W,H)*(0.9+Math.sin(t*b.speed)*0.1);
      const g=ctx.createRadialGradient(bx,by,0,bx,by,br);
      const alpha=0.07+Math.sin(t*b.speed*1.3)*0.02;
      g.addColorStop(0,`hsla(${b.hue},80%,55%,${alpha})`);
      g.addColorStop(0.5,`hsla(${b.hue+20},70%,40%,${alpha*.4})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.fillRect(0,0,W,H);
    });

    // subtle dot grid
    ctx.fillStyle='rgba(140,80,255,.06)';
    const sp=40;
    for(let x=0;x<W+sp;x+=sp){
      for(let y=0;y<H+sp;y+=sp){
        const pulse=Math.sin(t*.003+(x+y)*.03)*.5+.5;
        ctx.globalAlpha=pulse*.12+.02;
        ctx.beginPath();ctx.arc(x,y,.8,0,Math.PI*2);ctx.fill();
      }
    }
    ctx.globalAlpha=1;

    requestAnimationFrame(draw);
  }
  draw();
})();

// ═══ DATA ════════════════════════════════════════════════════
const DEF={
  alertMin:5,
  nc_safe_tick:48,nc_safe_max:250000,nc_safe_income:50000,
  nc_dj_interval:96,
  bunker_supply_no_boost:180,bunker_supply_boost:60,
  acid_supply:120,acid_supply_boost:40,acid_supply_both:20,acid_daily_dur:30,
  meth_supply:144,meth_supply_boost:48,
  cocaine_supply:150,cocaine_supply_boost:50,
  cash_supply:160,cash_supply_boost:53,
  weed_supply:160,weed_supply_boost:53,
  nc_warehouse:[
    {id:'guns',   name:'Sporting Goods',        biz:'Bunker',        max:100,fillH:66.67,color:'#F59E0B'},
    {id:'cocaine',name:'South American Imports',biz:'Cocaine Lockup', max:10, fillH:20,  color:'#E0E0E0'},
    {id:'meth',   name:'Pharma Research',       biz:'Meth Lab',      max:20, fillH:20,  color:'#00D4FF'},
    {id:'cash',   name:'Cash Creation',         biz:'Cash Factory',  max:40, fillH:20,  color:'#10B981'},
    {id:'cargo',  name:'Cargo & Shipments',     biz:'CEO / Hangar',  max:50, fillH:58.33,color:'#F97316'},
  ]
};

const BIZ={
  nightclub:{color:'#C084FC',glow:'rgba(192,132,252,.35)',rgb:'192,132,252',earn:'$50K / 48min'},
  bunker:   {color:'#FFB300',glow:'rgba(255,179,0,.35)',  rgb:'255,179,0',  earn:'$1,029,000'},
  acid:     {color:'#76FF03',glow:'rgba(118,255,3,.3)',   rgb:'118,255,3',  earn:'$351,840'},
  meth:     {color:'#00D4FF',glow:'rgba(0,212,255,.3)',   rgb:'0,212,255',  earn:'$892,500'},
  cocaine:  {color:'#E2E8F0',glow:'rgba(226,232,240,.2)',rgb:'226,232,240',earn:'$525,000'},
  cash:     {color:'#10B981',glow:'rgba(16,185,129,.3)', rgb:'16,185,129', earn:'$496,140'},
  weed:     {color:'#84CC16',glow:'rgba(132,204,22,.3)', rgb:'132,204,22', earn:'$425,280'},
};

// ═══ STATE ═══════════════════════════════════════════════════
function initState(){
  return{
    alertMin:DEF.alertMin,
    nc:{active:true,safeCollectedAt:null,djChangedAt:null,djInterval:DEF.nc_dj_interval,warehouseTracking:false,warehouseStartedAt:null,warehouseStock:{guns:0,cocaine:0,meth:0,cash:0,cargo:0},earned:0,saleCount:0},
    bunker: {active:true,mansionBoost:false,mansionBoostAt:null,supplyExhaustsAt:null,supplyMin:DEF.bunker_supply_no_boost,supplyBoostMin:DEF.bunker_supply_boost,earned:0,saleCount:0},
    acid:   {active:true,mansionBoost:false,mansionBoostAt:null,dailyBoost:false,dailyBoostAt:null,supplyExhaustsAt:null,supplyMin:DEF.acid_supply,supplyBoostMin:DEF.acid_supply_boost,supplyBothMin:DEF.acid_supply_both,earned:0,saleCount:0},
    meth:   {active:true,mansionBoost:false,mansionBoostAt:null,supplyExhaustsAt:null,supplyMin:DEF.meth_supply,supplyBoostMin:DEF.meth_supply_boost,earned:0,saleCount:0},
    cocaine:{active:true,mansionBoost:false,mansionBoostAt:null,supplyExhaustsAt:null,supplyMin:DEF.cocaine_supply,supplyBoostMin:DEF.cocaine_supply_boost,earned:0,saleCount:0},
    cash:   {active:true,mansionBoost:false,mansionBoostAt:null,supplyExhaustsAt:null,supplyMin:DEF.cash_supply,supplyBoostMin:DEF.cash_supply_boost,earned:0,saleCount:0},
    weed:   {active:true,mansionBoost:false,mansionBoostAt:null,supplyExhaustsAt:null,supplyMin:DEF.weed_supply,supplyBoostMin:DEF.weed_supply_boost,earned:0,saleCount:0},
    sessionPausedAt:null,
  };
}

let S=(()=>{
  try{const s=localStorage.getItem('gta_v4');if(s){
    const p=JSON.parse(s);
    ['bunker','acid','meth','cocaine','cash','weed'].forEach(id=>{
      if(!p[id])p[id]=initState()[id];
      if(p[id].earned===undefined)p[id].earned=0;
      if(p[id].saleCount===undefined)p[id].saleCount=0;
    });
    if(p.nc){if(p.nc.earned===undefined)p.nc.earned=0;if(p.nc.saleCount===undefined)p.nc.saleCount=0;}
    if(!p.nc)p.nc=initState().nc;
    if(p.nc.djInterval===120||p.nc.djInterval===undefined)p.nc.djInterval=DEF.nc_dj_interval;
    if(!p.nc.warehouseStock)p.nc.warehouseStock={guns:0,cocaine:0,meth:0,cash:0,cargo:0};
    ['guns','cocaine','meth','cash','cargo'].forEach(k=>{if(p.nc.warehouseStock[k]===undefined)p.nc.warehouseStock[k]=0;});
    return p;
  }}catch(e){}
  return initState();
})();
let notifTimers={},currentSettings=null;
function save(){localStorage.setItem('gta_v4',JSON.stringify(S));}

// ═══ HELPERS ═════════════════════════════════════════════════
function fmt(sec){if(sec<0)sec=0;const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);if(h>0)return`${h}:${p2(m)}:${p2(s)}`;return`${p2(m)}:${p2(s)}`;}
function p2(n){return String(n).padStart(2,'0');}
function fmtM(n){return'$'+n.toLocaleString();}
function refNow(){return S.sessionPausedAt||Date.now();}
function elMin(ts){return ts?(refNow()-ts)/60000:0;}
function isBoostActive(id){const b=S[id];if(!b.mansionBoost||!b.mansionBoostAt)return false;return Date.now()-b.mansionBoostAt<86400000;}
function isAcidDailyActive(){if(!S.acid.dailyBoost||!S.acid.dailyBoostAt)return false;return Date.now()-S.acid.dailyBoostAt<DEF.acid_daily_dur*60000;}
function mansionRemain(id){const b=S[id];if(!b.mansionBoostAt)return 0;return Math.max(0,(b.mansionBoostAt+86400000-Date.now())/1000);}
function acidDailyRemain(){if(!S.acid.dailyBoostAt)return 0;return Math.max(0,(S.acid.dailyBoostAt+DEF.acid_daily_dur*60000-Date.now())/1000);}
function getSupplyDur(id){
  const b=S[id];
  if(id==='acid'){const m=isBoostActive('acid'),d=isAcidDailyActive();if(m&&d)return b.supplyBothMin||DEF.acid_supply_both;if(m)return b.supplyBoostMin||DEF.acid_supply_boost;if(d)return Math.round((b.supplyMin||DEF.acid_supply)/2);return b.supplyMin||DEF.acid_supply;}
  if(isBoostActive(id)&&b.supplyBoostMin)return b.supplyBoostMin;
  return b.supplyMin;
}
function getTimerState(rem,alertMin){if(rem<=0)return'done';if(rem<=alertMin*60)return'danger';if(rem<=alertMin*60*4)return'warn';return'ok';}
function supplyRem(id){const b=S[id];if(!b.supplyExhaustsAt)return null;const ref=S.sessionPausedAt||Date.now();return Math.max(0,(b.supplyExhaustsAt-ref)/1000);}
function supplyPct(id){const rem=supplyRem(id);if(rem===null)return null;return Math.max(0,Math.min(1,rem/(getSupplyDur(id)*60)));}

// ═══ SEGMENTS / PROGRESS ═════════════════════════════════════
function segsHTML(id,pct,color,glow){
  const sc=pct!==null&&pct<0.2?'var(--danger)':pct!==null&&pct<0.4?'var(--warn)':color;
  const sg=pct!==null&&pct<0.2?'rgba(239,68,68,.5)':pct!==null&&pct<0.4?'rgba(245,158,11,.4)':(glow||color+'88');
  const pctNum=pct!==null?Math.max(0,Math.min(100,Math.round(pct*100))):0;
  const barHTML=pct!==null
    ?`<div class="prog-wrap"><div class="prog-track"><div class="prog-fill" style="width:${pctNum}%;background:linear-gradient(90deg,${sc}88,${sc});box-shadow:0 0 10px ${sg}"></div></div></div>`
    :'';
  const lit=pct===null?0:Math.min(5,Math.round(pct*5));
  const taps=[1,2,3,4,5].map(i=>{
    const on=i<=lit;
    return`<div class="seg-tap ${on?'on':''}" onclick="setSupplyPct('${id}',${i*0.2})" title="Set ${i*20}%"
      style="${on?`background:${sc};box-shadow:0 0 6px ${sg}`:''};"></div>`;
  }).join('');
  return`${barHTML}
  <div class="seg-taps">${taps}</div>
  <div class="seg-footer">
    <span class="seg-lbl" style="color:rgba(239,68,68,.5)" onclick="setSupplyPct('${id}',0)">Empty</span>
    <span class="seg-lbl">20</span><span class="seg-lbl">40</span><span class="seg-lbl">60</span><span class="seg-lbl">80</span>
    <span class="seg-lbl" style="color:${pct===null?'var(--sub2)':sc}">${pct===null?'tap →':pctNum+'%'}</span>
  </div>`;
}

// ═══ NOTIFICATIONS ═══════════════════════════════════════════
function reqNotif(){if(!('Notification' in window)){document.getElementById('nb').style.display='none';return;}Notification.requestPermission().then(p=>{document.getElementById('nb').style.display='none';if(p==='granted')scheduleAll();});}
function notify(title,body,tag){if(Notification.permission!=='granted')return;new Notification(title,{body,tag,requireInteraction:true});}
function scheduleNotif(key,ms,title,body){if(notifTimers[key])clearTimeout(notifTimers[key]);if(ms<=0){notify(title,body,key);return;}notifTimers[key]=setTimeout(()=>notify(title,body,key),ms);}
function scheduleSupplyNotif(id){const b=S[id];if(!b.active||!b.supplyExhaustsAt)return;scheduleNotif(id+'_s',b.supplyExhaustsAt-S.alertMin*60000-Date.now(),`⚠️ ${id.toUpperCase()}`,`Resupply in ${S.alertMin}min!`);}
function scheduleDJNotif(){if(!S.nc.djChangedAt)return;const at=S.nc.djChangedAt+S.nc.djInterval*60000-S.alertMin*60000;scheduleNotif('nc_dj',at-Date.now(),'🎵 NIGHTCLUB',`Change DJ in ${S.alertMin}min!`);}
function scheduleSafeNotif(){if(!S.nc.safeCollectedAt)return;const at=S.nc.safeCollectedAt+DEF.nc_safe_tick*60000*5-S.alertMin*60000;scheduleNotif('nc_safe',at-Date.now(),'💰 NIGHTCLUB SAFE','Safe nearly full!');}
function scheduleAll(){['bunker','acid','meth','cocaine','cash','weed'].forEach(scheduleSupplyNotif);scheduleDJNotif();scheduleSafeNotif();}

// ═══ PAUSE ═══════════════════════════════════════════════════
function togglePause(){if(S.sessionPausedAt)resumeSession();else pauseSession();}
function pauseSession(){if(S.sessionPausedAt)return;S.sessionPausedAt=Date.now();save();render();}
function resumeSession(){
  if(!S.sessionPausedAt)return;
  const offset=Date.now()-S.sessionPausedAt;
  ['bunker','acid','meth','cocaine','cash','weed'].forEach(id=>{
    if(S[id].supplyExhaustsAt)S[id].supplyExhaustsAt+=offset;
    if(S[id].mansionBoostAt)S[id].mansionBoostAt+=offset;
  });
  if(S.acid.dailyBoostAt)S.acid.dailyBoostAt+=offset;
  if(S.nc.djChangedAt)S.nc.djChangedAt+=offset;
  if(S.nc.safeCollectedAt)S.nc.safeCollectedAt+=offset;
  S.sessionPausedAt=null;save();scheduleAll();render();
}
function updatePauseUI(){
  const banner=document.getElementById('pause-banner');
  const hdrBtn=document.getElementById('pause-hdr-btn');
  const durEl=document.getElementById('pause-duration');
  if(!banner)return;
  if(S.sessionPausedAt){
    banner.classList.remove('hidden');
    if(hdrBtn){hdrBtn.textContent='▶';hdrBtn.style.color='#ef4444';}
    if(durEl){const mins=Math.round((Date.now()-S.sessionPausedAt)/60000);durEl.textContent=`Paused ${mins<1?'just now':mins+'min ago'} · NC warehouse still running`;}
  }else{
    banner.classList.add('hidden');
    if(hdrBtn){hdrBtn.textContent='⏸';hdrBtn.style.color='';}
  }
}

// ═══ MISSION BAR UPDATE ═══════════════════════════════════════
function updateMissionBar(){
  const ids=['bunker','acid','meth','cocaine','cash','weed'];
  const active=ids.filter(id=>S[id].active).length+(S.nc.active?1:0);
  const critical=ids.filter(id=>{
    if(!S[id].active)return false;
    const rem=supplyRem(id);
    return rem!==null&&rem<=S.alertMin*60;
  }).length;
  const totalEarned=['bunker','acid','meth','cocaine','cash','weed'].reduce((s,id)=>s+(S[id].earned||0),0)+(S.nc.earned||0);

  const msActive=document.getElementById('ms-active');
  const msCritical=document.getElementById('ms-critical');
  const msEarned=document.getElementById('ms-earned');
  const msStatus=document.getElementById('ms-status');
  if(msActive)msActive.textContent=active+'/7';
  if(msCritical){msCritical.textContent=critical;msCritical.style.color=critical>0?'var(--danger)':'var(--ok)';}
  if(msEarned)msEarned.textContent=totalEarned>0?'$'+Math.round(totalEarned/1000)+'K':'—';
  if(msStatus)msStatus.textContent=S.sessionPausedAt?'⏸ PAUSED':'● LIVE';
}

// ═══ ACTIONS ═════════════════════════════════════════════════
function setSupplyPct(id,pct){const durMs=getSupplyDur(id)*60000;S[id].supplyExhaustsAt=Date.now()+pct*durMs;save();scheduleSupplyNotif(id);render();}
function buySupplies(id){setSupplyPct(id,1.0);}
function collectSafe(){
  const el2=elMin(S.nc.safeCollectedAt);const ticks2=Math.min(5,Math.floor(el2/DEF.nc_safe_tick));
  const amt=ticks2*DEF.nc_safe_income;
  if(amt>0){S.nc.earned=(S.nc.earned||0)+amt;S.nc.saleCount=(S.nc.saleCount||0)+1;}
  S.nc.safeCollectedAt=Date.now();save();scheduleSafeNotif();render();
}
function logSale(id){
  const el=document.getElementById('earn_inp_'+id);if(!el)return;
  const raw=el.value.replace(/[^0-9]/g,'');const amt=parseInt(raw)||0;if(amt<=0)return;
  const k=id==='nightclub'?'nc':id;
  S[k].earned=(S[k].earned||0)+amt;S[k].saleCount=(S[k].saleCount||0)+1;
  el.value='';save();render();
}
function resetEarnings(id){const k=id==='nightclub'?'nc':id;S[k].earned=0;S[k].saleCount=0;save();render();}
function changeDJ(){S.nc.djChangedAt=Date.now();save();scheduleDJNotif();render();}
function toggleBiz(id){const k=id==='nightclub'?'nc':id;S[k].active=!S[k].active;save();render();}
function toggleMansionBoost(id){
  const b=S[id];const curPct=supplyPct(id);
  if(isBoostActive(id)){b.mansionBoost=false;b.mansionBoostAt=null;if(curPct!==null)b.supplyExhaustsAt=Date.now()+curPct*(b.supplyMin)*60000;}
  else{b.mansionBoost=true;b.mansionBoostAt=Date.now();const newDur=b.supplyBoostMin||getSupplyDur(id);if(curPct!==null)b.supplyExhaustsAt=Date.now()+curPct*newDur*60000;}

function saveSettings(){
  if(!currentSettings)return;
  if(currentSettings==='global')S.alertMin=parseInt(document.getElementById('s_alert')?.value)||5;
  else if(currentSettings==='nc')S.nc.djInterval=parseInt(document.getElementById('s_dj')?.value)||96;
  else if(['bunker','meth','acid','cocaine','cash','weed'].includes(currentSettings)){
    const id=currentSettings;
    S[id].supplyMin=parseInt(document.getElementById('s_supply')?.value)||60;
    const sb=document.getElementById('s_supply_b');if(sb)S[id].supplyBoostMin=parseInt(sb.value)||20;
    const s2=document.getElementById('s_supply_2');if(s2)S[id].supplyBothMin=parseInt(s2.value)||20;
  }
  save();scheduleAll();document.getElementById('settingsModal').classList.remove('open');render();
}

function renderWarehouse(){
  const nc=S.nc;
  if(!nc.warehouseTracking){
    const rows=DEF.nc_warehouse.map(p=>`
    <div class="wh-product">
      <div class="wh-ph"><div><div class="wh-name" style="color:${p.color}">${p.name}</div><div class="wh-biz">${p.biz} · max ${p.max}u · ${p.fillH.toFixed(0)}h fill</div></div></div>
      <div class="wh-input-row"><span style="font-size:11px;color:var(--sub2)">Current:</span><input class="wh-input" id="wh_in_${p.id}" type="number" min="0" max="${p.max}" value="${nc.warehouseStock[p.id]||0}"><span style="font-size:11px;color:var(--sub2)">/ ${p.max}</span></div>
    </div>`).join('');
    return`<div style="font-size:11px;color:var(--sub2);margin-bottom:11px">Enter current stock to start tracking.</div>
    ${rows}<div style="height:10px"></div>
    <button class="btn-main accent" onclick="setWarehouseStock()" style="background:linear-gradient(135deg,#C084FC,#a855f7);color:#fff;box-shadow:0 6px 24px rgba(192,132,252,.35)">▶ Start Tracking</button>`;
  }
  const elH=elMin(nc.warehouseStartedAt)/60;let minSec=Infinity,nextP=null;
  const rows=DEF.nc_warehouse.map(p=>{
    const rate=p.max/p.fillH;const cur=Math.min(p.max,nc.warehouseStock[p.id]+elH*rate);
    const rem=Math.max(0,p.max-cur);const secFull=rem/rate*3600;const pct=cur/p.max;const full=cur>=p.max;
    if(secFull<minSec){minSec=secFull;nextP=p;}
    return`<div class="wh-product ${full?'full-alert':''}">
      <div class="wh-ph"><div><div class="wh-name" style="color:${p.color}">${p.name}</div><div class="wh-biz">${p.biz}</div></div>
        <div style="text-align:right"><div class="wh-val" id="wh_cur_${p.id}" style="color:${p.color}">${cur.toFixed(1)}/${p.max}</div><div class="wh-time" id="wh_rem_${p.id}">${full?'<span style="color:var(--gold)">FULL</span>':fmt(secFull)}</div></div>
      </div>
      <div class="wh-pb"><div class="wh-pb-fill" id="wh_pb_${p.id}" style="width:${Math.round(pct*100)}%;background:${p.color}"></div></div>
      ${full?`<button class="btn-main" onclick="sellProduct('${p.id}')" style="margin-top:9px;background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.3);color:var(--gold);border-radius:13px;padding:11px;font-size:12px;font-weight:800;cursor:pointer;width:100%">💰 Sold — Reset</button>`:''}
    </div>`;
  }).join('');
  const firstFull=DEF.nc_warehouse.find(p=>{const r=p.max/p.fillH;const c=Math.min(p.max,nc.warehouseStock[p.id]+elH*r);return c>=p.max;});
  const nextBox=firstFull
    ?`<div class="wh-next alert"><div class="wh-next-lbl">⚠ Ready to Sell</div><div class="wh-next-name">${firstFull.name}</div><div style="font-size:11px;color:var(--sub2)">Tony's SMS should arrive soon</div></div>`
    :nextP?`<div class="wh-next"><div class="wh-next-lbl">Next to fill</div><div class="wh-next-name" id="wh_next_name">${nextP.name}</div><div class="wh-next-time" id="wh_next_time">${fmt(minSec)}</div></div>`:'';
  return`${nextBox}${rows}<div style="height:8px"></div><button class="btn-sm" style="width:100%" onclick="resetWarehouse()">↺ Re-enter stock</button>`;
}

function renderEarningsSummary(){

  const total=items.reduce((s,x)=>{const b=S[x.key];return s+(b&&b.earned?b.earned:0);},0);
  const totalSales=items.reduce((s,x)=>{const b=S[x.key];return s+(b&&b.saleCount?b.saleCount:0);},0);

  const rows=items.filter(x=>{const b=S[x.key];return b&&b.earned>0;}).map(x=>{

  }).join('');
  return`<div class="sec-lbl">Earnings Summary</div>
  <div class="earn-summary-card">
    <div style="display:flex;align-items:flex-start;justify-content:space-between">
      <div><div class="es-total-lbl">Total Earned</div><div class="es-total-amt">${fmtM(total)}</div><div class="es-total-sub">${totalSales} sale${totalSales>1?'s':''} across all businesses</div></div>
      <button class="btn-sm" onclick="resetAllEarnings()" style="font-size:10px;align-self:flex-start">↺ Reset All</button>

    <div class="hdiv" style="margin:15px 0"></div>

  </div>`;
}
function resetAllEarnings(){['nc','bunker','acid','meth','cocaine','cash','weed'].forEach(k=>{if(S[k]){S[k].earned=0;S[k].saleCount=0;}});save();render();}

// ═══ MAIN RENDER ═════════════════════════════════════════════
function render(){
  document.getElementById('root').innerHTML=
    renderNightclub()+
    `<div class="sec-lbl">Illegal Businesses</div><div class="cards">`+
    renderBunker()+renderAcid()+renderMeth()+
    renderMC('cocaine','❄️','COCAINE LOCKUP')+
    renderMC('cash','💵','CASH FACTORY')+
    renderMC('weed','🌿','WEED FARM')+
    `</div>`+
    renderEarningsSummary();
  if(!S.nc.warehouseTracking)DEF.nc_warehouse.forEach(p=>{const el=document.getElementById('wh_in_'+p.id);if(el)el.value=S.nc.warehouseStock[p.id]||0;});
  updateMissionBar();
}

// ═══ LIVE UPDATE ══════════════════════════════════════════════
function liveUpdate(){
  updatePauseUI();updateMissionBar();
  ['bunker','acid','meth','cocaine','cash','weed'].forEach(id=>{
    const rem=supplyRem(id);const pct=supplyPct(id);const bz=BIZ[id]||{};
    const state=rem===null?'idle':S.sessionPausedAt?'warn':getTimerState(rem,S.alertMin);
    const sc=pct!==null&&pct<0.2?'var(--danger)':pct!==null&&pct<0.4?'var(--warn)':bz.color;
    const sg=pct!==null&&pct<0.2?'rgba(239,68,68,.5)':pct!==null&&pct<0.4?'rgba(245,158,11,.4)':(bz.glow||'rgba(255,255,255,.3)');
    const el=document.querySelector(`[data-id="${id}"] .timer-num`);
    if(el){el.className=`timer-num state-${state}`;el.textContent=rem===null?'—':fmt(rem);}
    const ep=document.querySelector(`[data-id="${id}"] .timer-pct`);
    if(ep){ep.style.color=pct===null?'var(--sub2)':sc;ep.style.textShadow=pct!==null?`0 0 20px ${sc}`:'none';ep.textContent=pct!==null?Math.round(pct*100)+'%':'—';}
    const es=document.querySelector(`[data-id="${id}"] .timer-status`);
    if(es)es.textContent=rem===null?'tap segment to sync':S.sessionPausedAt?'⏸ SESSION PAUSED':'until empty';
    // progress bar
    const pb=document.querySelector(`[data-id="${id}"] .prog-fill`);
    if(pb){const pctNum=pct!==null?Math.max(0,Math.min(100,Math.round(pct*100))):0;pb.style.width=pctNum+'%';pb.style.background=`linear-gradient(90deg,${sc}88,${sc})`;}
    // segments
    const lit=pct===null?0:Math.min(5,Math.round(pct*5));
    document.querySelectorAll(`[data-id="${id}"] .seg-tap`).forEach((seg,i)=>{
      const on=i<lit;seg.className=`seg-tap ${on?'on':''}`;
      if(on){seg.style.background=sc;seg.style.boxShadow=`0 0 6px ${sg}`;}
      else{seg.style.background='';seg.style.boxShadow='';}
    });
  });
  // NC safe
  const safeEl2=elMin(S.nc.safeCollectedAt);const ticks2=Math.min(5,Math.floor(safeEl2/DEF.nc_safe_tick));
  const safeAmt2=ticks2*DEF.nc_safe_income;const safePct2=safeAmt2/DEF.nc_safe_max;
  const sbc2=safePct2>0.8?'var(--gold)':safePct2>0.5?'var(--warn)':'var(--ok)';
  const safeAmtEl=document.querySelector('.safe-amount');if(safeAmtEl)safeAmtEl.textContent=fmtM(safeAmt2);
  document.querySelectorAll('.stk').forEach((t,i)=>{t.className='stk'+(i<ticks2?' full':'');});
  const safeBarEl=document.getElementById('safe_bar');if(safeBarEl){safeBarEl.style.width=Math.round(safePct2*100)+'%';safeBarEl.style.background=sbc2;}
  // DJ
  const djEl2=elMin(S.nc.djChangedAt);const djRem2=S.nc.djChangedAt?Math.max(0,(S.nc.djInterval-djEl2)*60):null;
  const djTimerEl=document.querySelector('.dj-timer');if(djTimerEl&&djRem2!=null)djTimerEl.textContent=fmt(djRem2);
  // Warehouse
  if(S.nc.warehouseTracking){
    const elH=elMin(S.nc.warehouseStartedAt)/60;let minSec=Infinity,nextP=null,needRender=false;
    DEF.nc_warehouse.forEach(p=>{
      const rate=p.max/p.fillH;const cur=Math.min(p.max,S.nc.warehouseStock[p.id]+elH*rate);
      const rem=Math.max(0,p.max-cur);const secFull=rem/rate*3600;const pct=cur/p.max;const full=cur>=p.max;
      if(secFull<minSec){minSec=secFull;nextP=p;}
      const elCur=document.getElementById('wh_cur_'+p.id);if(elCur)elCur.textContent=cur.toFixed(1)+'/'+p.max;
      const elRem=document.getElementById('wh_rem_'+p.id);
      if(elRem){const newHTML=full?'<span style="color:var(--gold)">FULL</span>':fmt(secFull);if(elRem.innerHTML!==newHTML){elRem.innerHTML=newHTML;if(full)needRender=true;}}
      const elPb=document.getElementById('wh_pb_'+p.id);if(elPb)elPb.style.width=Math.round(pct*100)+'%';
    });
    const elNt=document.getElementById('wh_next_time');if(elNt&&minSec<Infinity)elNt.textContent=fmt(minSec);
    const elNn=document.getElementById('wh_next_name');if(elNn&&nextP)elNn.textContent=nextP.name;
    if(needRender)render();
  }
}

setInterval(()=>{try{liveUpdate();}catch(e){}},1000);
setInterval(()=>render(),60000);

if('serviceWorker' in navigator){

      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller)
            document.getElementById('update-banner').style.display='flex';
        });
      });
    }).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
  });
}
function applyUpdate(){navigator.serviceWorker.ready.then(reg=>{if(reg.waiting)reg.waiting.postMessage('skipWaiting');});}
